name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "9宫格GIF合成工具" `
          --add-data "g1.gif:." `
          --add-data "g2.gif:." `
          --add-data "g3.gif:." `
          --add-data "g4.gif:." `
          --add-data "g5.gif:." `
          gui.py

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/9宫格GIF合成工具.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
